services:
  db:
    image: mysql:8.4
    container_name: calendario-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./BackEnd
    container_name: calendario-backend
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push &&
      npx prisma db execute --schema prisma/schema.prisma --file prisma/seed.sql &&
      npm start"
    
  frontend:
    build:
      context: ./FrontEnd
    container_name: calendario-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: